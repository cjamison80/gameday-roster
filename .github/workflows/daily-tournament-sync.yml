name: Daily Tournament Sync

# Cron trigger paused — USSSA, 2D Sports, and Perfect Game TournamentSource
# records all still have permission_status: "unknown". Re-enable the
# `schedule:` trigger once that's resolved to "approved" for the sources
# you actually want running unattended.
on:
  workflow_dispatch:

jobs:
  sync-tournaments:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run daily tournament sync
        env:
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          BASE44_ADMIN_EMAIL: ${{ secrets.BASE44_ADMIN_EMAIL }}
          BASE44_ADMIN_PASSWORD: ${{ secrets.BASE44_ADMIN_PASSWORD }}
          BASE44_APP_BASE_URL: ${{ secrets.BASE44_APP_BASE_URL }}
          MAX_EVENTS_PER_SOURCE: '75'
          REQUEST_DELAY_MS: '1500'
        run: npm run sync:tournaments
